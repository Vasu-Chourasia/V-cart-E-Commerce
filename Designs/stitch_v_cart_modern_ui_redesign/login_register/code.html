<p class="text-body-md font-body-md text-on-surface-variant">Sign in to your V-Cart account</p>
</div>
<!-- Form -->
<form class="space-y-md">
<div>

<input class="w-full px-md py-sm bg-surface-container-lowest border border-outline-variant/80 rounded focus:border-secondary focus:ring-2 focus:ring-secondary/20 transition-all outline-none text-body-md font-body-md text-on-surface" id="email" placeholder="you@example.com" type="email"/>
</div>
<div>
<label class="block text-label-caps font-label-caps text-on-surface mb-xs" for="password">Password</label>
<input class="w-full px-md py-sm bg-surface-container-lowest border border-outline-variant/80 rounded focus:border-secondary focus:ring-2 focus:ring-secondary/20 transition-all outline-none text-body-md font-body-md text-on-surface" id="password" placeholder="••••••••" type="password"/>
<div class="flex justify-end mt-sm">
<a class="text-label-caps font-label-caps text-secondary hover:text-secondary-fixed-dim transition-colors" href="#">Forgot password?</a>
</div>
</div>
<button class="w-full bg-primary hover:bg-primary/90 text-on-primary py-md rounded text-label-caps font-label-caps transition-colors shadow-sm" type="submit">
                    Sign In
                </button>
</form>
<div class="mt-lg relative">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-outline-variant/50"></div>
</div>
<div class="relative flex justify-center text-label-caps font-label-caps">
<span class="bg-surface-container-lowest px-md text-on-surface-variant">Or continue with</span>
</div>
</div>
